<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Your Track — Nightscape Radio</title>

   <link rel="icon" type="image/png" href="favicon.png">
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

  <style>
    body {
      margin: 0;
      font-family: 'Montserrat', sans-serif;
      background: radial-gradient(circle at top, #3A0CA3, #0A0A0F);
      color: #F8F6FF;
    }

    header {
      padding: 1.5rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(10, 10, 15, 0.7);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .logo {
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #C8A2C8;
    }

    nav a {
      color: #F8F6FF;
      text-decoration: none;
      margin-left: 1rem;
      transition: 0.3s;
    }

    nav a:hover {
      color: #C8A2C8;
    }

    .hero {
      padding: 3rem 2rem 1rem;
      max-width: 900px;
      margin: 0 auto;
      text-align: center;
    }

    .hero h1 {
      font-size: 2.8rem;
      margin-bottom: 0.5rem;
      color: #C8A2C8;
      text-shadow: 0 0 15px rgba(200, 162, 200, 0.4);
    }

    .hero p {
      max-width: 600px;
      margin: 0 auto;
      line-height: 1.6;
      color: #EDE7F6;
    }

    .products {
      padding: 2rem;
      max-width: 1100px;
      margin: 0 auto 3rem;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 2rem;
    }

    .product-card {
      background: rgba(58, 12, 163, 0.15);
      border: 1px solid rgba(200, 162, 200, 0.2);
      border-radius: 15px;
      padding: 1rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(8px);
      transition: 0.3s;
    }

    .product-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 35px rgba(123, 44, 191, 0.4);
    }

    .product-card img {
      width: 100%;
      border-radius: 10px;
      margin-bottom: 0.75rem;
      object-fit: cover;
      max-height: 260px;
      box-shadow: 0 0 20px rgba(200, 162, 200, 0.3);
    }

    .product-title {
      font-weight: 600;
      margin-bottom: 0.25rem;
      color: #EDE7F6;
    }

    .product-price {
      color: #C8A2C8;
      font-weight: 500;
      margin-bottom: 0.75rem;
    }

    .buy-button {
      display: inline-block;
      text-align: center;
      padding: 0.6rem 0.9rem;
      border-radius: 999px;
      background: #7B2CBF;
      color: #F8F6FF;
      font-weight: 600;
      text-decoration: none;
      font-size: 0.9rem;
      transition: 0.3s;
    }

    .buy-button:hover {
      background: #9D4EDD;
    }

    footer {
      padding: 1.5rem 2rem;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 0.85rem;
      color: #C8A2C8;
      text-align: center;
    }
@keyframes floatUp {
  0% { transform: translateY(0); opacity: 0.8; }
  100% { transform: translateY(-120vh); opacity: 0; }
}
/* Make images responsive */
img {
  max-width: 100%;
  height: auto;
}

/* Make iframe (SoundCloud) responsive */
iframe {
  max-width: 100%;
  height: auto;
}

/* Responsive text scaling */
h1, h2, h3, p {
  word-wrap: break-word;
}

/* Responsive grid spacing on small screens */
@media (max-width: 600px) {
  .products {
    grid-template-columns: 1fr;
    padding: 1rem;
  }

  .product-card {
    margin-bottom: 1.5rem;
  }

  header {
    flex-direction: column;
    text-align: center;
  }

  nav a {
    display: inline-block;
    margin: 0.5rem;
  }
}

  </style>
</head>

<body>

  <header>
    <div class="logo">Afrotious Nation</div>
    <nav>
     <a href="index.html">Marketplace</a>
      <a href="music-universe.html">Music Universe</a>
      <a href="contact.html">Contact</a>
      <a href="about.html" class="header-btn">About</a>
      <a href="faq.html" class="header-btn">FAQ</a>
      <a href="creator-application.html" class="header-btn">Creator Application</a>
      <a href="custom-orders.html" class="header-btn">Custom Orders</a>
      <a href="cosmic-lore.html" class="header-btn">Cosmic Lore</a>
	<a href="news.html" class="header-btn">News</a>
	<a href="coming-soon.html" class="header-btn">Blog</a>
	<a href="coming-soon.html" class="header-btn">Events</a>
	<a href="radio.html" class="header-btn">Cosmic Radio</a>
	<a class="header-btn" href="creator-dashboard.html">Dashboard</a>
    </nav>
  </header>


<body>

    <div class="container">
        <h1>Submit Your Track</h1>

        <form name="radio-submission" method="POST" data-netlify="true" enctype="multipart/form-data">

            <!-- Hidden Identity Fields (NEW) -->
            <input type="hidden" name="creator-email" id="creator-email">
            <input type="hidden" name="creator-id" id="creator-id">

            <!-- Track Title -->
            <label for="title">Track Title</label>
            <input type="text" id="title" name="title" required>

            <!-- Artist Name -->
            <label for="artist">Artist Name</label>
            <input type="text" id="artist" name="artist" required>

            <!-- Genre -->
            <label for="genre">Genre</label>
            <select id="genre" name="genre" required>
                <option value="">Select Genre</option>
                <option>R&B</option>
                <option>Hip-Hop</option>
                <option>Electronic</option>
                <option>Lo-Fi</option>
                <option>Indie</option>
                <option>Pop</option>
                <option>Ambient</option>
                <option>Experimental</option>
            </select>

            <label for="explicit">Is this track explicit?</label>
            <select id="explicit" name="explicit" required>
                <option value="Clean">Clean</option>
                <option value="Explicit">Explicit</option>
            </select>

            <!-- File Upload -->
            <label for="file">Upload MP3 or WAV</label>
            <input type="file" id="file" name="file" accept=".mp3,.wav" required>

            <button type="submit">Submit Track</button>
<input type="hidden" name="creator-email" id="creator-email">
<input type="hidden" name="creator-id" id="creator-id">

        </form>
    </div>

    <!-- Identity Linking Script (NEW) -->
    <script>
        netlifyIdentity.on('init', user => {
            if (user) {
                document.getElementById('creator-email').value = user.email;
                document.getElementById('creator-id').value = user.id;
            }
        });
    </script>
<script>
document.addEventListener("DOMContentLoaded", () => {
    const user = netlifyIdentity.currentUser();
    if (user) {
        document.getElementById("creator-email").value = user.email;
        document.getElementById("creator-id").value = user.id;
    }
});
</script>

</body>
</html>
