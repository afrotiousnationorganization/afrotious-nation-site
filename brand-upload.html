<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Brand Upload — Afrotious Nation</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="icon" type="image/png" href="favicon.png">
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

    <style>
        body {
            margin: 0;
            font-family: 'Montserrat', sans-serif;
            background: radial-gradient(circle at top, #3A0CA3, #0A0A0F);
            color: #F8F6FF;
        }

        header {
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(10, 10, 15, 0.7);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo {
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: #C8A2C8;
        }

        nav a {
            color: #F8F6FF;
            text-decoration: none;
            margin-left: 1rem;
            transition: 0.3s;
        }

        nav a:hover {
            color: #C8A2C8;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 40px 20px;
        }

        h1 {
            font-size: 2.4rem;
            color: #ff4fd8;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-top: 20px;
            font-size: 1rem;
            color: #C8A2C8;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border-radius: 8px;
            border: none;
            background-color: #111118;
            color: #fff;
        }

        button {
            margin-top: 30px;
            width: 100%;
            padding: 15px;
            background-color: #ff4fd8;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 1.2rem;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.8;
        }

        #logout-btn {
            margin-top: 20px;
            padding: 12px;
            background: #7B2CBF;
            border-radius: 8px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            border: none;
        }

        footer {
            padding: 1.5rem 2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.85rem;
            color: #C8A2C8;
            text-align: center;
            margin-top: 40px;
        }
    </style>
</head>

<body>

<header>
    <div class="logo">Afrotious Nation</div>
    <nav>
        <a href="index.html">Marketplace</a>
        <a href="music-universe.html">Music Universe</a>
        <a href="creator-application.html">Creator Application</a>
        <a href="radio.html">Cosmic Radio</a>
        <a href="creator-portal.html">Creator Portal</a>
    </nav>
</header>

<div class="container">

    <h1>Brand Upload</h1>
    <p id="auth-status">Checking authentication...</p>

    <div id="upload-content" style="display:none;">

        <form name="brand-upload" method="POST" data-netlify="true" enctype="multipart/form-data">

            <!-- Hidden identity fields -->
            <input type="hidden" name="creator-email" id="creator-email">
            <input type="hidden" name="creator-id" id="creator-id">

            <label>Brand Name</label>
            <input type="text" name="brand-name" required>

            <label>Brand Description</label>
            <textarea name="brand-description" rows="5" required></textarea>

            <label>Upload Brand Assets</label>
            <input type="file" name="brand-files" multiple required>

            <label>Website / Social Links (optional)</label>
            <input type="text" name="brand-links" placeholder="Website, Instagram, TikTok, etc.">

            <button type="submit">Upload Brand Assets</button>
        </form>

        <button id="logout-btn">Log Out</button>

    </div>

</div>

<footer>
    All original content © 2025–2026 Afrotious Nation  
</footer>

<script>
document.addEventListener("DOMContentLoaded", () => {

    const user = netlifyIdentity.currentUser();
    const authStatus = document.getElementById("auth-status");
    const uploadContent = document.getElementById("upload-content");

    if (!user) {
        authStatus.innerHTML = "You must be logged in to upload brand assets.";
        netlifyIdentity.open();
        return;
    }

    authStatus.innerHTML = "Authenticated as: " + user.email;
    uploadContent.style.display = "block";

    document.getElementById("creator-email").value = user.email;
    document.getElementById("creator-id").value = user.id;

    document.getElementById("logout-btn").addEventListener("click", () => {
        netlifyIdentity.logout();
        location.reload();
    });
});
</script>

</body>
</html>
