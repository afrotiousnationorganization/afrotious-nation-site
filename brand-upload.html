<body>

<header>

<div class="container">

    <h1>Brand Upload</h1>

    <p id="auth-status" style="margin-top:20px;font-size:1.2rem;">
        Checking authentication...
    </p>

    <div id="upload-content" style="display:none;margin-top:40px;">

        <form name="brand-upload" method="POST" data-netlify="true" enctype="multipart/form-data">

            <input type="hidden" name="creator-email" id="creator-email">
            <input type="hidden" name="creator-id" id="creator-id">

            <label>Brand Name</label>
            <input type="text" name="brand-name" required>

            <label>Brand Description</label>
            <textarea name="brand-description" rows="5" required></textarea>

            <label>Upload Brand Assets</label>
            <input type="file" name="brand-files" multiple required>

            <label>Website / Social Links (optional)</label>
            <input type="text" name="brand-links" placeholder="Website, Instagram, TikTok, etc.">

            <button type="submit">Upload Brand Assets</button>
        </form>

        <button id="logout-btn">Log Out</button>

    </div>

</div>

<footer>
    <p style="margin: 8px 0; font-size: 1rem;">

    </p>

        Powered by Stripe
    </p>
</footer>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const particleContainer = document.createElement("div");
  particleContainer.style.position = "fixed";
  particleContainer.style.top = 0;
  particleContainer.style.left = 0;
  particleContainer.style.width = "100%";
  particleContainer.style.height = "100%";
  particleContainer.style.pointerEvents = "none";
  particleContainer.style.zIndex = "0";
  document.body.appendChild(particleContainer);

  function createParticle() {
    const p = document.createElement("div");
    p.style.position = "absolute";
    p.style.width = "6px";
    p.style.height = "6px";
    p.style.borderRadius = "50%";
    p.style.background = "rgba(200,162,200,0.8)";
    p.style.boxShadow = "0 0 12px rgba(200,162,200,0.9)";
    p.style.left = Math.random() * window.innerWidth + "px";
    p.style.top = window.innerHeight + "px";
    p.style.opacity = 0.8;
    p.style.animation = "floatUp 12s linear forwards";

    particleContainer.appendChild(p);
    setTimeout(() => p.remove(), 12000);
  }

  setInterval(createParticle, 450);

  // Authentication check
  const user = netlifyIdentity.currentUser();
  const authStatus = document.getElementById("auth-status");
  const uploadContent = document.getElementById("upload-content");

  if (!user) {
    authStatus.innerHTML = "You must be logged in to upload brand assets.";
    netlifyIdentity.open();
  } else {
    authStatus.innerHTML = "Authenticated as: " + user.email;
    uploadContent.style.display = "block";

    document.getElementById("creator-email").value = user.email;
    document.getElementById("creator-id").value = user.id;
  }

  // Logout
  document.getElementById("logout-btn").addEventListener("click", () => {
    netlifyIdentity.logout();
    location.reload();
  });
});
</script>

</body>
